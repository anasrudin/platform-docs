# services/controller/docker-compose.yml
services:
  consul:
    image: hashicorp/consul:1.17
    command: "agent -dev -ui -client=0.0.0.0"
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - platform-net
