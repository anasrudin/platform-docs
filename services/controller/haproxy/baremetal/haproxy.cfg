# haproxy.cfg — Static config untuk baremetal / local dev
#
# Tidak menggunakan consul-template. Backend di-hardcode dengan IP/port tetap.
# Cocok untuk:
#   - Local development (semua service di localhost)
#   - Single-node baremetal server
#
# Untuk multi-node dengan service discovery → gunakan server/haproxy.cfg.ctmpl
#
# Cara pakai:
#   haproxy -f services/controller/haproxy/baremetal/haproxy.cfg
#
# Port mapping:
#   :80    → frontend (routing ke backend per tier)
#   :8404  → stats dashboard
#   :8080  → platform-api (langsung, tidak lewat LB)
#   :8081  → fc-agent
#   :8082  → wasm-agent
#   :8083  → gui-agent
#
# Untuk ganti IP server (baremetal remote):
#   Cari "127.0.0.1" dan ganti dengan IP node yang sesuai.

global
    maxconn 4096
    log stdout format raw local0 info
    stats socket /var/run/haproxy/admin.sock mode 660 level admin expose-fd listeners
    stats timeout 30s

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    option http-server-close
    option redispatch
    timeout connect  5s
    timeout client  30s
    timeout server  30s
    retries 3

# ── Stats UI ──────────────────────────────────────────────────────────────────
# Akses: http://localhost:8404/stats
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats show-legends
    stats admin if LOCALHOST

# ── Frontend utama ────────────────────────────────────────────────────────────
frontend sandbox_api
    bind *:80

    # Routing berdasarkan header X-Runtime
    # Client set: X-Runtime: wasm | microvm | gui
    acl is_microvm  hdr(X-Runtime) -i microvm
    acl is_gui      hdr(X-Runtime) -i gui

    use_backend sandbox_microvm if is_microvm
    use_backend sandbox_gui     if is_gui
    default_backend sandbox_wasm

# ── WASM backend ──────────────────────────────────────────────────────────────
# Tools: html_parse, json_parse, markdown_convert, docx_generate
backend sandbox_wasm
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # slowstart: jangan langsung banjiri node baru saat start
    default-server inter 10s fall 3 rise 2 slowstart 30s

    # Tambah baris server untuk setiap wasm-agent node
    # Format: server <id> <ip>:<port> check
    server wasm-1 127.0.0.1:8082 check

# ── Firecracker (microVM) backend ─────────────────────────────────────────────
# Tools: python_run, bash_run, git_clone, file_ops
#
# PENTING: fc-agent return 503 dari /health saat pool penuh (overloaded).
# HAProxy otomatis exclude node tersebut dari rotation sampai ada slot kosong.
# Ini adalah overload-based 503 strategy dari CCU.
backend sandbox_microvm
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # slowstart 60s: FC VM butuh warm-up lebih lama
    # timeout 60s: eksekusi Python bisa lama
    default-server inter 10s fall 3 rise 2 slowstart 60s
    timeout server 60s

    # Tambah baris server untuk setiap fc-agent node
    server fc-1 127.0.0.1:8081 check

# ── GUI backend ───────────────────────────────────────────────────────────────
# Tools: browser_open, web_scrape, excel_edit, office_automation
backend sandbox_gui
    balance leastconn
    option httpchk GET /health
    http-check expect status 200

    # timeout 120s: browser automation bisa butuh waktu
    default-server inter 10s fall 3 rise 2 slowstart 30s
    timeout server 120s

    # Tambah baris server untuk setiap gui-agent node
    server gui-1 127.0.0.1:8083 check
