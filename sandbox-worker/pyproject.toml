[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sandbox-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "redis>=5.2.0",
    "psycopg2-binary>=2.9.0",
    "minio>=7.2.0",
    "python-multipart>=0.0.12",
    "structlog>=24.4.0",
    "pydantic>=2.10.0",
    "httpx>=0.27.0",
    "ruff>=0.15.9",
    "mypy>=1.20.0",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
platform-api = "api.app:main"
fc-agent      = "agents.fc_agent:main"
wasm-agent    = "agents.wasm_agent:main"
gui-agent     = "agents.gui_agent:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
